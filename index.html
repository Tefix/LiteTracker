<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Lehe pealkiri brauseri vahekaardil – hajusrakenduste sõnavara kontroll -->
    <title>Hajusrakenduste sõnavara kontroll</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>&gt; hajusrakendused_sõnavara</h1>
    <p class="subtitle">// eesti ↔ vene · distributed systems vocabulary</p>

    <!-- Kahe veeruga tabel: veerg 1 = eesti→vene, veerg 2 = vene→eesti -->
    <table class="quiz-table">
        <thead>
            <tr>
                <th>[ ET → RU ]</th>
                <th>[ RU → ET ]</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <!-- Veerg 1: kuvatakse eestikeelne sõna, kasutaja sisestab venekeelse vaste -->
                <td class="card">
                    <div class="word-display" id="et-word">…</div>
                    <input type="text" id="et-input" placeholder="Sisesta venekeelne vaste">
                    <br>
                    <button class="btn btn-check" onclick="checkAnswer('et-input','et-result')">Kontrolli</button>
                    <button class="btn btn-next"  onclick="loadEtWord()">Järgmine</button>
                    <!-- Siia kuvatakse kontrolli tulemus -->
                    <div class="result" id="et-result"></div>
                </td>

                <!-- Veerg 2: kuvatakse venekeelne sõna, kasutaja sisestab eestikeelse vaste -->
                <td class="card">
                    <div class="word-display" id="ru-word">…</div>
                    <input type="text" id="ru-input" placeholder="Sisesta eestikeelne vaste">
                    <br>
                    <button class="btn btn-check" onclick="checkAnswer('ru-input','ru-result')">Kontrolli</button>
                    <button class="btn btn-next"  onclick="loadRuWord()">Järgmine</button>
                    <!-- Siia kuvatakse kontrolli tulemus -->
                    <div class="result" id="ru-result"></div>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Värskenda nupp laadib mõlemasse veergu uued juhuslikud sõnad -->
    <button class="refresh-btn" onclick="refreshAll()">↺ refresh_all()</button>

    <script src="script.js"></script>
</body>
</html>
